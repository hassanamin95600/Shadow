name: Build Test IPA

on:
  push:
    branches:
      - cmp-rewrite
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned full iOS IPA
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-
          save-always: true

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          touch local.properties
          if [[ -n "${RELEASE_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          fi

      - name: Prepare iOS dependencies
        run: |
          set -o pipefail
          mkdir -p build
          ./scripts/prepare-ios-dependencies.sh 2>&1 | tee build/prepare.log
          git submodule status MPVKit || true
          if [[ ! -f MPVKit/Package.swift ]]; then
            echo "::error title=MPVKit submodule missing::git submodule update did not provide MPVKit/Package.swift (see git exit 128)."
            exit 1
          fi

      - name: Build unsigned full ${{ env.IOS_CONFIGURATION }} IPA
        run: |
          set -o pipefail
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          mkdir -p build
          ./scripts/build-ios-ipa.sh 2>&1 | tee build/ios-build.log

      - name: Report iOS build failure
        if: failure()
        run: |
          {
            echo "### iOS build diagnostics"
            echo
            echo "MPVKit: $(git submodule status MPVKit 2>&1 || true)"
            echo
            echo "**prepare.log (tail)**"
            echo '```'
            tail -n 60 build/prepare.log 2>/dev/null || echo "(prepare.log missing)"
            echo '```'
            echo "**ios-build.log (errors)**"
            echo '```'
            grep -E "error:|fatal:|The following build commands failed|did not produce|Undefined symbol|error " build/ios-build.log 2>/dev/null | tail -n 50 || echo "(ios-build.log missing)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          summary="$(grep -E "error:|fatal:|The following build commands failed|did not produce|Undefined symbol" build/ios-build.log build/prepare.log 2>/dev/null | head -n 12 | tr '\n' ' ' | cut -c1-5000)"
          echo "::error title=iOS build failed::${summary:-see the run summary for diagnostics}"

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: shadow-ios-${{ env.IOS_CONFIGURATION }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
